name: CI Pipeline - AutoRepuestos Express

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout del código fuente (Git Checkout)
      uses: actions/checkout@v4

    - name: 2. Configurar el entorno de Python (Build)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest

    - name: 4. Verificación de estilo estático de código (Lint)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 5. Ejecución de la suite de pruebas unitarias (Test)
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        pytest -v
